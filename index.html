<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#273129" />
    <title>Maneya Interiors — Enquire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div class="logo-frame">
          <img src="maneya-logo.png" alt="Maneya Interiors — Crafting the art of living" />
        </div>
        <a class="header-action" href="#enquiry-title">Enquire <span aria-hidden="true">↘</span></a>
      </header>
      <section class="hero" aria-label="Maneya Interiors services">
        <div class="hero-track">
          <img class="hero-image is-active" src="interior-services-landscape.webp" alt="Maneya Interiors services: residential, commercial, modular kitchen, bedroom design and custom furniture" />
          <img class="hero-image" src="wide-living-room.webp" alt="A warm, elegant Maneya Interiors living room" />
        </div>
        <div class="hero-dots" aria-hidden="true"><span class="is-active"></span><span></span></div>
      </section>

      <section class="enquiry" aria-labelledby="enquiry-title">
        <div class="form-heading" id="enquiry-title">
          <p class="eyebrow">Begin your transformation</p>
        </div>

        <form id="enquiry-form" novalidate>
          <label for="name">Your name</label>
          <div class="field-wrap">
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required />
          </div>
          <label for="phone">Phone number</label>
          <div class="field-wrap phone-wrap">
            <span class="country-code">+91</span>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" required />
          </div>
          <p class="error" id="form-error" role="alert"></p>
          <button type="submit">Request a callback <span aria-hidden="true">→</span></button>
        </form>

        <div class="form-copy">
          <h2>Let’s create your<br /><em>dream space.</em></h2>
          <p>Tell us a little about yourself. Our design team will be in touch shortly.</p>
        </div>

      </section>
    </main>
    <div class="success-modal" id="success-message" role="dialog" aria-modal="true" aria-labelledby="success-title" hidden>
      <div class="success-card">
        <button class="modal-close" id="success-close" type="button" aria-label="Close success message">×</button>
        <div class="tick">✓</div>
        <h2 id="success-title">Enquiry received</h2>
        <p>Thank you! Our design team will call you shortly.</p>
        <button class="modal-button" id="success-done" type="button">Done</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
